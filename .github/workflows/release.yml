name: Continuous Deployment

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build (${{ matrix.crate }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: jconduit
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - crate: jconduit
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - crate: jconduit
            os: macos-latest
            target: aarch64-apple-darwin

          - crate: cargo-jconduit
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG="${GITHUB_REF_NAME}"

          echo "Tag: $TAG"
          echo "Cargo version: $VERSION"

          if [ "v$VERSION" != "$TAG" ]; then
            echo "❌ Version mismatch between tag and Cargo.toml"
            exit 1
          fi

      - name: Test
        run: cargo test -p ${{ matrix.crate }} --locked

      - name: Build
        run: cargo build -p ${{ matrix.crate }} --release --locked --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: matrix.crate == 'jconduit' && matrix.os != 'windows-latest'
        run: |
          tar -czf jconduit-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            jconduit \
            -C ../../../ \
            README.md LICENSE*

      - name: Package (Windows)
        if: matrix.crate == 'jconduit' && matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/jconduit.exe, README.md, LICENSE* `
            -DestinationPath jconduit-${{ matrix.target }}.zip

      - name: Upload artifacts
        if: matrix.crate == 'jconduit'
        uses: actions/upload-artifact@v4
        with:
          name: jconduit-${{ matrix.target }}
          path: |
            jconduit-*.tar.gz
            jconduit-*.zip


  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release (ONLY ONCE)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish_crates_io:
    name: Publish cargo-jconduit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check if version already exists on crates.io
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          CRATE="cargo-jconduit"

          if curl -s "https://crates.io/api/v1/crates/$CRATE/$VERSION" | grep -q '"version"'; then
            echo "✔ Already published on crates.io, skipping"
            exit 0
          fi

      - name: Verify package
        run: cargo package -p cargo-jconduit

      - name: Publish to crates.io
        run: cargo publish -p cargo-jconduit --locked --token ${{ secrets.CRATES_IO_TOKEN }}