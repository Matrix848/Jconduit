name: Continuous Deployment

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.crate }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: jconduit
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: jconduit-linux-x86_64.tar.gz

          - crate: jconduit
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: jconduit-windows-x86_64.zip

          - crate: jconduit
            os: macos-13
            target: x86_64-apple-darwin
            artifact: jconduit-macos-x86_64.tar.gz

          - crate: jconduit
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: jconduit-macos-arm64.tar.gz

          - crate: cargo-jconduit
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cargo-jconduit-linux-x86_64.tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test -p ${{ matrix.crate }} --locked

      - name: Build Release Binary
        run: cargo build -p ${{ matrix.crate }} --release --locked --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: matrix.crate == 'jconduit' && matrix.os != 'windows-latest'
        run: |
          tar -czf ${{ matrix.artifact }} \
            -C target/${{ matrix.target }}/release \
            jconduit \
            -C ../../../ \
            README.md LICENSE*

      - name: Package (Windows)
        if: matrix.crate == 'jconduit' && matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/jconduit.exe, README.md, LICENSE* `
            -DestinationPath ${{ matrix.artifact }}

      - name: Generate SHA256 (Linux/macOS)
        if: matrix.crate == 'jconduit' && matrix.os != 'windows-latest'
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Generate SHA256 (Windows)
        if: matrix.crate == 'jconduit' && matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $hash = (Get-FileHash ${{ matrix.artifact }} -Algorithm SHA256).Hash
          "$hash  ${{ matrix.artifact }}" | Out-File "${{ matrix.artifact }}.sha256"

      - name: Upload Release Assets
        if: matrix.crate == 'jconduit'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish_crates_io:
    name: Publish cargo-jconduit to crates.io
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish cargo-jconduit
        run: cargo login ${{ secrets.CRATES_IO_TOKEN }} && cargo publish -p cargo-jconduit --locked