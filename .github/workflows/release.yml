name: Continuous Deployment

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true


jobs:
  validate:
    name: Validate Tag & Cargo Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tag Matches Cargo.toml
        shell: bash
        run: |
          set -e

          TAG="${GITHUB_REF_NAME}"
          METADATA=$(cargo metadata --no-deps --format-version 1)

          VERSION_JCONDUIT=$(echo "$METADATA" | jq -r '.packages[] | select(.name=="jconduit") | .version')
          VERSION_CARGO=$(echo "$METADATA" | jq -r '.packages[] | select(.name=="cargo-jconduit") | .version')

          echo "Tag: $TAG"
          echo "jconduit: v$VERSION_JCONDUIT"
          echo "cargo-jconduit: v$VERSION_CARGO"

          if [ "$TAG" != "v$VERSION_JCONDUIT" ]; then
            echo "Version mismatch for jconduit"
            exit 1
          fi

          if [ "$TAG" != "v$VERSION_CARGO" ]; then
            echo "Version mismatch for cargo-jconduit"
            exit 1
          fi

          echo "All versions match ✔"
  

  publish_crates:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish jconduit
        shell: bash
        run: |
          set -e
          cargo publish -p jconduit --locked --token ${{ secrets.CRATES_IO_TOKEN }} || \
          echo "jconduit already published or skipped"

      - name: Publish cargo-jconduit
        shell: bash
        run: |
          set -e
          cargo publish -p cargo-jconduit --locked --token ${{ secrets.CRATES_IO_TOKEN }} || \
          echo "cargo-jconduit already published or skipped"
  

  build:
    name: Build (${{ matrix.crate }} - ${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # ---------------- jconduit ----------------
          - crate: jconduit
            bin: jconduit
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64

          - crate: jconduit
            bin: jconduit
            os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64

          - crate: jconduit
            bin: jconduit
            os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64

          # -------------- cargo-jconduit --------------
          - crate: cargo-jconduit
            bin: cargo-jconduit
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64

          - crate: cargo-jconduit
            bin: cargo-jconduit
            os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64

          - crate: cargo-jconduit
            bin: cargo-jconduit
            os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p ${{ matrix.crate }} --locked

      - name: Build
        run: cargo build -p ${{ matrix.crate }} --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          STAGING="${{ matrix.crate }}-${{ matrix.suffix }}"
          mkdir -p "$STAGING"

          cp target/${{ matrix.target }}/release/${{ matrix.bin }} "$STAGING/"
          cp README.md LICENSE* "$STAGING/" 2>/dev/null || true

          tar -czf "${STAGING}.tar.gz" "$STAGING"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $STAGING = "${{ matrix.crate }}-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force -Path $STAGING | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}.exe" -Destination $STAGING
          Copy-Item "README.md" -Destination $STAGING -ErrorAction SilentlyContinue
          Copy-Item "LICENSE*" -Destination $STAGING -ErrorAction SilentlyContinue

          Compress-Archive -Path "$STAGING/*" -DestinationPath "${STAGING}.zip"

      # ---------------- UPLOAD ----------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate }}-${{ matrix.target }}
          path: |
            ${{ matrix.crate }}-${{ matrix.suffix }}.tar.gz
            ${{ matrix.crate }}-${{ matrix.suffix }}.zip
          if-no-files-found: error


  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}