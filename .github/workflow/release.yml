on:
push:
tags:
  - 'v*'

permissions:
contents: write

jobs:
build_assets:
name: Build Release Asset (${{ matrix.target }})
runs-on: ${{ matrix.os }}
  
  ```
strategy:
  fail-fast: false
  matrix:
    include:
      - os: ubuntu-latest
        target: x86_64-unknown-linux-gnu
        artifact_name: jconduit-linux-x86_64.tar.gz

      - os: windows-latest
        target: x86_64-pc-windows-msvc
        artifact_name: jconduit-windows-x86_64.zip

      - os: macos-13
        target: x86_64-apple-darwin
        artifact_name: jconduit-macos-x86_64.tar.gz

      - os: macos-latest
        target: aarch64-apple-darwin
        artifact_name: jconduit-macos-arm64.tar.gz

steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Setup Rust Toolchain
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: ${{ matrix.target }}

  - name: Cache Rust Dependencies
    uses: Swatinem/rust-cache@v2

  - name: Run Tests
    run: cargo test --locked

  - name: Build Release Binary
    run: cargo build --release --locked --target ${{ matrix.target }}

  - name: Verify Binaries (Windows)
    if: matrix.os == 'windows-latest'
    shell: powershell
    run: |
      Test-Path "target/${{ matrix.target }}/release/jconduit.exe"
      Test-Path "target/${{ matrix.target }}/release/cargo-jconduit.exe"

  - name: Verify Binaries (Linux/macOS)
    if: matrix.os != 'windows-latest'
    run: |
      test -f target/${{ matrix.target }}/release/jconduit
      test -f target/${{ matrix.target }}/release/cargo-jconduit

  - name: Package Binary (Windows)
    if: matrix.os == 'windows-latest'
    shell: powershell
    run: |
      Compress-Archive `
        -Path `
          target/${{ matrix.target }}/release/jconduit.exe,
          target/${{ matrix.target }}/release/cargo-jconduit.exe,
          README.md,
          LICENSE* `
        -DestinationPath ${{ matrix.artifact_name }}

  - name: Package Binary (Linux/macOS)
    if: matrix.os != 'windows-latest'
    run: |
      tar -czf ${{ matrix.artifact_name }} \
        -C target/${{ matrix.target }}/release \
        jconduit \
        cargo-jconduit \
        -C ../../../ \
        README.md \
        LICENSE*

  - name: Generate SHA256 Checksum (Windows)
    if: matrix.os == 'windows-latest'
    shell: powershell
    run: |
      $hash = (Get-FileHash "${{ matrix.artifact_name }}" -Algorithm SHA256).Hash
      "$hash  ${{ matrix.artifact_name }}" | Out-File "${{ matrix.artifact_name }}.sha256"

  - name: Generate SHA256 Checksum (Linux/macOS)
    if: matrix.os != 'windows-latest'
    run: |
      sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

  - name: Upload Release Assets
    uses: softprops/action-gh-release@v2
    with:
      generate_release_notes: true
      files: |
        ${{ matrix.artifact_name }}
        ${{ matrix.artifact_name }}.sha256
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ```

