name: Continuous Deployment

on:
  push:
    tags:
      - 'v*' # Triggers strictly on v1.0.0, v0.2.1, etc.

# 💡 Gives this specific workflow permission to write to GitHub Releases
permissions:
  contents: write

jobs:
  build_assets:
    name: Build Release Asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: jconduit-linux.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: jconduit-windows.zip

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: jconduit-macos.tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@439d6ee257ca656a8fa3d0d8beeb770743b40092
        with:
          targets: ${{ matrix.target }}

      - name: Build Optimized Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          compress-archive -path jconduit.exe, cargo-jconduit.exe -destinationpath ../../../${{ matrix.artifact_name }}

      - name: Package Binary (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }} jconduit cargo-jconduit

      - name: Upload to GitHub Release Page
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically generated token by GitHub

