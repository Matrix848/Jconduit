[package]
name = "cargo-jconduit"
version.workspace = true
edition.workspace = true
description = "Cargo tool that generates a Rust-Java FFI bridge using user-defined C headers"
homepage = "https://github.com/Matrix848/Jconduit"
repository = "https://github.com/Matrix848/Jconduit"
keywords = ["java", "ffm", "ffi", "generator", "jni"]
categories = ["development-tools::ffi", "development-tools"]
license = "MIT OR Apache-2.0"
readme = "../../README.md"
publish = true

[lib]
name = "cargo_jconduit"
path = "src/lib.rs"

[[bin]]
name = "cargo-jconduit"
path = "src/bin/cargo_jconduit.rs"
required-features = ["cargo-build"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
anyhow = "1.0"
toml = "1.1"
prettyplease = "0.2"
dunce = "1.0"
askama = "0.16"
thiserror = "2.0"
log = "0.4"
tree-sitter = "0.26"
tree-sitter-cpp = "0.23"
env_logger = { version = "0.11", optional = true }
regex = "1.12"
indoc = "2.0"
proc-macro2 = "1.0"
petgraph = "0.8.3"


[features]
default = []
cargo-build = ["dep:env_logger"]
